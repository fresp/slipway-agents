<svg width="100%" viewBox="0 0 680 1180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>slipway-agents pipeline</title>
<desc>Full pipeline from raw idea through brainstorm, docs generation, review, grooming, planning, build, and sync</desc>

<style>
  text { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: 12px; fill: #2c2c2a; }
  .label { font-size: 11px; fill: #5f5e5a; }
  .sub { font-size: 11px; fill: #888780; }
  .stage { font-size: 11px; fill: #888780; }
  .node-title { font-size: 13px; font-weight: 600; fill: #2c2c2a; }
  .node-sub { font-size: 11px; fill: #5f5e5a; }
  /* purple - orchestrator */
  .orch rect { fill: #EEEDFE; stroke: #534AB7; }
  .orch .node-title { fill: #3C3489; }
  .orch .node-sub { fill: #534AB7; }
  /* teal - subagents */
  .agent rect { fill: #E1F5EE; stroke: #0F6E56; }
  .agent .node-title { fill: #085041; }
  .agent .node-sub { fill: #0F6E56; }
  /* blue - outputs */
  .output rect { fill: #E6F1FB; stroke: #185FA5; }
  .output .node-title { fill: #0C447C; }
  .output .node-sub { fill: #185FA5; }
  /* green - validated state */
  .valid rect { fill: #EAF3DE; stroke: #3B6D11; }
  .valid .node-title { fill: #27500A; }
  /* gray - inputs */
  .input rect { fill: #F1EFE8; stroke: #888780; }
  .input .node-title { fill: #444441; }
  /* coral - decision */
  .decision rect { fill: #FAECE7; stroke: #993C1D; }
  .decision .node-title { fill: #712B13; }
  .decision .node-sub { fill: #993C1D; }
  /* amber - callout */
  .callout rect { fill: #FAEEDA; stroke: #854F0B; }
  .callout .node-title { fill: #633806; font-size: 11px; }
  /* arrows */
  .arr { stroke: #888780; stroke-width: 1; fill: none; marker-end: url(#arrowhead); }
  .dash { stroke: #b4b2a9; stroke-width: 0.5; fill: none; stroke-dasharray: 4 3; }
  .dash-arr { stroke: #b4b2a9; stroke-width: 0.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrowhead-muted); }
  @media (prefers-color-scheme: dark) {
    text { fill: #c2c0b6; }
    .label, .sub, .stage { fill: #888780; }
    .node-title { fill: #e8e6dc; }
    .node-sub { fill: #b4b2a9; }
    .orch rect { fill: #26215C; stroke: #7F77DD; }
    .orch .node-title { fill: #CECBF6; }
    .orch .node-sub { fill: #AFA9EC; }
    .agent rect { fill: #04342C; stroke: #1D9E75; }
    .agent .node-title { fill: #9FE1CB; }
    .agent .node-sub { fill: #5DCAA5; }
    .output rect { fill: #042C53; stroke: #378ADD; }
    .output .node-title { fill: #B5D4F4; }
    .output .node-sub { fill: #85B7EB; }
    .valid rect { fill: #173404; stroke: #639922; }
    .valid .node-title { fill: #C0DD97; }
    .input rect { fill: #2C2C2A; stroke: #5F5E5A; }
    .input .node-title { fill: #D3D1C7; }
    .decision rect { fill: #4A1B0C; stroke: #D85A30; }
    .decision .node-title { fill: #F5C4B3; }
    .decision .node-sub { fill: #F0997B; }
    .callout rect { fill: #412402; stroke: #BA7517; }
    .callout .node-title { fill: #FAC775; }
  }
</style>

<defs>
  <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrowhead-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b4b2a9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Stage rail -->
<line x1="72" y1="60" x2="72" y2="1140" stroke="#d3d1c7" stroke-width="0.5"/>

<!-- Stage labels -->
<text class="stage" x="52" y="116" text-anchor="middle">Input</text>
<text class="stage" x="52" y="268" text-anchor="middle">PRD</text>
<text class="stage" x="52" y="450" text-anchor="middle">Docs</text>
<text class="stage" x="52" y="610" text-anchor="middle">Review</text>
<text class="stage" x="52" y="760" text-anchor="middle">Plan</text>
<text class="stage" x="52" y="900" text-anchor="middle">Build</text>
<text class="stage" x="52" y="1060" text-anchor="middle">Sync</text>

<!-- INPUT BOXES -->
<g class="input">
  <rect x="95" y="72" width="160" height="44" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="175" y="94" text-anchor="middle" dominant-baseline="central">Raw idea / prompt</text>
</g>
<g class="input">
  <rect x="280" y="72" width="160" height="44" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="360" y="94" text-anchor="middle" dominant-baseline="central">PRD / doc yang ada</text>
</g>

<!-- Arrows inputs → slipway -->
<line x1="175" y1="116" x2="250" y2="148" class="arr"/>
<line x1="360" y1="116" x2="290" y2="148" class="arr"/>

<!-- SLIPWAY ORCHESTRATOR -->
<g class="orch">
  <rect x="160" y="148" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="168" text-anchor="middle" dominant-baseline="central">slipway</text>
  <text class="node-sub" x="270" y="186" text-anchor="middle" dominant-baseline="central">orchestrator &amp; router</text>
</g>
<line x1="380" y1="176" x2="450" y2="176" class="dash"/>
<text class="label" x="456" y="171" dominant-baseline="central">mode detection:</text>
<text class="sub" x="456" y="184" dominant-baseline="central">bootstrap / extend / sync</text>

<!-- slipway → drafting-table -->
<line x1="270" y1="204" x2="270" y2="228" class="arr"/>

<!-- DRAFTING TABLE -->
<g class="agent">
  <rect x="160" y="228" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="248" text-anchor="middle" dominant-baseline="central">drafting-table</text>
  <text class="node-sub" x="270" y="266" text-anchor="middle" dominant-baseline="central">Q&amp;A → .ai/docs/01-prd.md</text>
</g>
<line x1="380" y1="256" x2="450" y2="256" class="dash"/>
<text class="label" x="456" y="250" dominant-baseline="central">gap-fill loop</text>
<text class="sub" x="456" y="264" dominant-baseline="central">(max 8 questions)</text>

<!-- drafting-table → PRD complete -->
<line x1="270" y1="284" x2="270" y2="308" class="arr"/>

<!-- PRD COMPLETE -->
<g class="valid">
  <rect x="160" y="308" width="220" height="44" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="330" text-anchor="middle" dominant-baseline="central">✓ PRD lengkap (8 sections)</text>
</g>

<!-- PRD → hull-builder -->
<line x1="270" y1="352" x2="270" y2="376" class="arr"/>

<!-- HULL BUILDER -->
<g class="agent">
  <rect x="160" y="376" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="396" text-anchor="middle" dominant-baseline="central">hull-builder</text>
  <text class="node-sub" x="270" y="414" text-anchor="middle" dominant-baseline="central">invoke bootstrap-from-prd skill</text>
</g>

<!-- hull-builder → docs output -->
<line x1="270" y1="432" x2="270" y2="456" class="arr"/>

<!-- DOCS OUTPUT -->
<g class="output">
  <rect x="110" y="456" width="320" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="473" text-anchor="middle" dominant-baseline="central">.ai/docs/02–10 + AGENT.md</text>
  <text class="node-sub" x="270" y="491" text-anchor="middle" dominant-baseline="central">arch · boundaries · data · API · flows · standards · ADRs · topology · planning</text>
</g>

<!-- optimize loop (left) -->
<path d="M110 484 L88 484 L88 584 L160 584" class="dash-arr"/>
<text class="sub" x="78" y="525" text-anchor="middle">optimize</text>
<text class="sub" x="78" y="538" text-anchor="middle">loop</text>

<!-- docs → inspector -->
<line x1="270" y1="512" x2="270" y2="556" class="arr"/>

<!-- INSPECTOR -->
<g class="agent">
  <rect x="160" y="556" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="576" text-anchor="middle" dominant-baseline="central">inspector</text>
  <text class="node-sub" x="270" y="594" text-anchor="middle" dominant-baseline="central">cross-doc validation + health score</text>
</g>
<line x1="380" y1="584" x2="450" y2="584" class="dash"/>
<g class="callout">
  <rect x="450" y="566" width="132" height="36" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="516" y="584" text-anchor="middle" dominant-baseline="central">Health score 0–100</text>
</g>

<!-- inspector → critical decision -->
<line x1="270" y1="612" x2="270" y2="636" class="arr"/>

<!-- CRITICAL DECISION -->
<g class="decision">
  <rect x="160" y="636" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="653" text-anchor="middle" dominant-baseline="central">Critical? → optimize dulu</text>
  <text class="node-sub" x="270" y="671" text-anchor="middle" dominant-baseline="central">max 2 loop optimize</text>
</g>

<!-- decision → groomer -->
<line x1="270" y1="692" x2="270" y2="716" class="arr"/>

<!-- GROOMER -->
<g class="agent">
  <rect x="160" y="716" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="736" text-anchor="middle" dominant-baseline="central">groomer</text>
  <text class="node-sub" x="270" y="754" text-anchor="middle" dominant-baseline="central">Lead Dev · QA · DevOps readiness</text>
</g>

<!-- groomer → rigger -->
<line x1="270" y1="772" x2="270" y2="796" class="arr"/>

<!-- RIGGER -->
<g class="agent">
  <rect x="160" y="796" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="816" text-anchor="middle" dominant-baseline="central">rigger</text>
  <text class="node-sub" x="270" y="834" text-anchor="middle" dominant-baseline="central">phase &amp; milestone breakdown</text>
</g>

<!-- rigger → planning output -->
<line x1="270" y1="852" x2="270" y2="876" class="arr"/>

<!-- PLANNING OUTPUT -->
<g class="output">
  <rect x="110" y="876" width="320" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="893" text-anchor="middle" dominant-baseline="central">.ai/planning/ (phases 00–07)</text>
  <text class="node-sub" x="270" y="911" text-anchor="middle" dominant-baseline="central">tasks · owners · acceptance criteria · FR trace</text>
</g>

<!-- planning → build -->
<line x1="270" y1="932" x2="270" y2="956" class="arr"/>

<!-- BUILD -->
<g class="orch">
  <rect x="120" y="956" width="260" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="250" y="976" text-anchor="middle" dominant-baseline="central">Sisyphus / omo.dev</text>
  <text class="node-sub" x="250" y="994" text-anchor="middle" dominant-baseline="central">implements via AGENT.md + planning</text>
</g>
<line x1="380" y1="984" x2="450" y2="984" class="dash"/>
<text class="label" x="456" y="978" dominant-baseline="central">Ada fitur baru?</text>
<text class="sub" x="456" y="992" dominant-baseline="central">→ shipwright + extend</text>
<!-- extend mode loop -->
<path d="M450 998 L450 1024 L580 1024 L580 844 L430 844" class="dash-arr"/>
<text class="sub" x="592" y="932" dominant-baseline="central">extend</text>
<text class="sub" x="592" y="946" dominant-baseline="central">mode</text>

<!-- build → chronicler -->
<line x1="250" y1="1012" x2="270" y2="1036" class="arr"/>

<!-- CHRONICLER -->
<g class="agent">
  <rect x="160" y="1036" width="220" height="56" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="270" y="1056" text-anchor="middle" dominant-baseline="central">chronicler ✦ new</text>
  <text class="node-sub" x="270" y="1074" text-anchor="middle" dominant-baseline="central">sync docs dengan kenyataan</text>
</g>
<line x1="160" y1="1064" x2="100" y2="1064" class="dash"/>
<text class="sub" x="94" y="1052" text-anchor="end">.pipeline-</text>
<text class="sub" x="94" y="1066" text-anchor="end">state.md</text>
<text class="sub" x="94" y="1080" text-anchor="end">&amp; changelog</text>

<!-- chronicler → sync output -->
<line x1="270" y1="1092" x2="270" y2="1116" class="arr"/>

<!-- SYNC OUTPUT -->
<g class="valid">
  <rect x="90" y="1116" width="420" height="44" rx="8" stroke-width="0.5"/>
  <text class="node-title" x="300" y="1133" text-anchor="middle" dominant-baseline="central">README.md + /docs + AGENT.md + .ai/docs (incremental)</text>
  <text class="sub" x="300" y="1149" text-anchor="middle" dominant-baseline="central">detect drift → flag → update → changelog entry</text>
</g>
</svg>
